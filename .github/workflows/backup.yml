# Nightly encrypted database backup (Feature Inventory Order 84).
# Dumps the database with the Supabase CLI, encrypts it with age to the
# founder's public key, and stores it in a private Cloudflare R2 bucket with
# a 30-day lifecycle rule. Runs in the "backup" GitHub Environment, which has
# no approval gate so it can run unattended, and holds only the secrets
# below. Fails closed (and GitHub emails the failure) when anything is missing.
name: Nightly database backup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to back up"
        required: true
        default: staging
        type: choice
        options: [staging]

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    # Scheduled runs start once the founder sets BACKUP_ENABLED=true after setup.
    if: github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: backup
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      SUPABASE_CLI: supabase@3.0.0
    steps:
      - name: Check the backup configuration
        env:
          PROJECT_REF: ${{ secrets.BACKUP_SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          POOLER_HOST: ${{ vars.BACKUP_DB_POOLER_HOST }}
        run: |
          [[ "$POOLER_HOST" =~ ^[a-z0-9.-]+\.pooler\.supabase\.com$ ]] || { echo "BACKUP_DB_POOLER_HOST is missing (Supabase → Connect → Session pooler host)"; exit 1; }
          [[ "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "BACKUP_SUPABASE_PROJECT_REF is missing"; exit 1; }
          [ -n "$DB_PASSWORD" ] || { echo "BACKUP_SUPABASE_DB_PASSWORD is missing"; exit 1; }
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo "BACKUP_AGE_RECIPIENT is missing or not an age public key"; exit 1; }
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "BACKUP_R2_ACCOUNT_ID is missing"; exit 1; }
          [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] || { echo "R2 credentials are missing"; exit 1; }
          [[ "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9-]{2,62}$ ]] || { echo "BACKUP_R2_BUCKET is missing"; exit 1; }
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump, encrypt, and upload
        env:
          PROJECT_REF: ${{ secrets.BACKUP_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DB_PASSWORD }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
          POOLER_HOST: ${{ vars.BACKUP_DB_POOLER_HOST }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          # Assembled at runtime from secrets; no credential is stored in this file.
          db_url="$(printf 'postgresql://%s:%s@%s:5432/postgres' "postgres.${PROJECT_REF}" "$SUPABASE_DB_PASSWORD" "$POOLER_HOST")"
          npx --yes "$SUPABASE_CLI" db dump --db-url "$db_url" -f "$work/schema.sql"
          npx --yes "$SUPABASE_CLI" db dump --db-url "$db_url" --data-only -f "$work/data.sql"
          tar -C "$work" -czf "$work/backup.tar.gz" schema.sql data.sql
          age -r "$AGE_RECIPIENT" -o "$work/backup.tar.gz.age" "$work/backup.tar.gz"
          sha256sum "$work/backup.tar.gz.age" | cut -d' ' -f1 > "$work/backup.sha256"
          key="${TARGET}/${stamp}.tar.gz.age"
          aws s3 cp "$work/backup.tar.gz.age" "s3://${R2_BUCKET}/${key}" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
          aws s3 cp "$work/backup.sha256" "s3://${R2_BUCKET}/${key}.sha256" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
          echo "BACKUP_STORED target=$TARGET object=$key bytes=$(stat -c%s "$work/backup.tar.gz.age")"
