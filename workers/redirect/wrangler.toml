# Canonical short-link redirect Worker. Deployed only by
# .github/workflows/deploy-staging.yml (Staging). Production is enabled by the
# R1 production cutover card.
name = "op4n-redirect"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = false

[env.staging]
name = "op4n-redirect-staging"
routes = [{ pattern = "staging.op4n.me/*", zone_name = "op4n.me" }]

# Persist Worker logs (event names, codes, request IDs; never destinations or addresses).
[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
invocation_logs = true

[env.staging.vars]
OP4N_ENVIRONMENT = "staging"
FRONTEND_ORIGIN = "https://staging.op4n.com"
# API_BASE_URL is passed with --var at deploy time; INTERNAL_SERVICE_CREDENTIAL is a Worker secret.
